<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PLAYTA — Join Match">
  <title>PLAYTA · Join Match</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* ── Join Page Specific Styles ── */
    :root {
      --bg:#000; --card:#0A0A0A; --card2:#161B22;
      --border:#252D38; --t0:#fff; --t1:#8B949E; --t2:#58666E;
      --green:#11FF66; --cyan:#00E5FF; --red:#FF4C4C; --orange:#FF9F43;
      --grad:linear-gradient(90deg,#11FF66 0%,#11FF66 55%,#00E5FF 100%);
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--t0);
      font-family:'Inter',sans-serif; min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }

    #joinLoader {
      position:fixed; inset:0; background:var(--bg);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:16px; z-index:999;
    }
    .loader-spinner {
      width:40px; height:40px; border:3px solid var(--border);
      border-top-color:var(--green); border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Header ── */
    .jh-top {
      display:flex; align-items:center; gap:12px;
      padding:14px 16px; border-bottom:1px solid var(--border);
      background:var(--card); position:sticky; top:0; z-index:10;
    }
    .jh-back {
      width:36px; height:36px; border-radius:50%;
      background:var(--card2); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      color:var(--t1); cursor:pointer; flex-shrink:0;
      transition:color .2s;
    }
    .jh-back:hover { color:var(--t0); }
    .jh-game { display:flex; align-items:center; gap:10px; flex:1; }
    .jh-game-logo {
      width:32px; height:32px; border-radius:8px; object-fit:cover;
    }
    .jh-game-name { font-size:15px; font-weight:600; }
    .jh-badge {
      font-size:12px; font-weight:600; color:var(--green);
      background:rgba(17,255,102,.1); border:1px solid rgba(17,255,102,.25);
      border-radius:20px; padding:4px 12px; white-space:nowrap;
    }
    .jh-info {
      display:flex; align-items:center; gap:16px; flex-wrap:wrap;
      padding:10px 16px; background:var(--card);
      border-bottom:1px solid var(--border);
    }

    /* ── Main scroll container ── */
    #joinMain { padding:16px; max-width:600px; margin:0 auto; }

    /* ── Section headers ── */
    .join-section {
      background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:18px; margin-bottom:16px;
    }
    .join-section h3 {
      font-size:15px; font-weight:600; margin-bottom:14px;
      padding-bottom:10px; border-bottom:1px solid var(--border);
    }

    /* ── Slot Grid ── */
    .slot-grid-header { margin-bottom:14px; }
    .slot-grid-header h3 { border:none; padding-bottom:0; margin-bottom:4px; }
    .slot-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    .slot-cell {
      aspect-ratio:1;
      border-radius:10px;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:2px; cursor:pointer;
      transition:all .18s ease;
      font-family:'Inter',sans-serif;
    }
    .slot-cell.available {
      background:var(--card2); border:1px solid var(--border);
    }
    .slot-cell.available:hover {
      border-color:var(--green);
      background:rgba(17,255,102,.08);
    }
    .slot-cell.selected {
      border:2px solid var(--green);
      background:rgba(17,255,102,.12);
    }
    .slot-cell.taken {
      background:#0d0d0d; border:1px solid #1a1a1a;
      opacity:.4; cursor:not-allowed;
    }
    .slot-num  { font-size:13px; font-weight:700; color:var(--t0); }
    .slot-status { font-size:10px; font-weight:600; color:var(--t1); }
    .slot-cell.available .slot-status { color:var(--cyan); }
    .slot-cell.selected  .slot-status { color:var(--green); }
    .slot-cell.taken     .slot-status { color:var(--t2); }

    .slot-selected-info {
      margin-top:12px; padding:10px 14px;
      background:rgba(17,255,102,.08);
      border:1px solid rgba(17,255,102,.25);
      border-radius:8px; font-size:13px; color:var(--green);
    }

    /* ── Player Fields ── */
    .pf-section h3.pf-title { display:flex; flex-direction:column; gap:2px; }
    .pf-group { margin-bottom:14px; }
    .pf-label {
      display:block; font-size:12px; font-weight:500;
      color:var(--t1); margin-bottom:7px;
    }
    .pf-input {
      width:100%; background:#0d0d0d; border:1px solid var(--border);
      border-radius:10px; padding:12px 14px; font-size:14px;
      font-family:'Inter',sans-serif; color:var(--t0); outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    .pf-input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(17,255,102,.08); }
    .pf-input::placeholder { color:#3f4a57; }
    .pf-help { font-size:11px; color:var(--t2); margin-top:5px; }

    /* ── Entry Section ── */
    .entry-section { }
    .entry-cost-info {
      background:var(--card2); border:1px solid var(--border);
      border-radius:10px; padding:14px; margin-bottom:14px;
    }
    .ec-row {
      display:flex; justify-content:space-between;
      font-size:13px; padding:5px 0;
      border-bottom:1px solid rgba(37,45,56,.5);
    }
    .ec-row:last-child { border-bottom:none; }
    .ec-amount  { font-weight:700; color:var(--t0); }
    .ec-balance { font-weight:700; }
    .ec-total   { font-size:15px; font-weight:800; margin-top:4px; }
    .ec-total span:last-child { color:var(--green); }

    .entry-free-badge {
      background:rgba(17,255,102,.08); border:1px solid rgba(17,255,102,.25);
      border-radius:10px; padding:14px; text-align:center;
      font-size:14px; font-weight:600; color:var(--green); margin-bottom:14px;
    }

    /* ── Join Button ── */
    .btn-join-confirm {
      display:block; width:100%; padding:16px;
      background:var(--grad); box-shadow:0 0 20px rgba(17,255,102,.4);
      border:none; border-radius:12px;
      font-family:'Inter',sans-serif; font-size:15px;
      font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
      color:#000; cursor:pointer; transition:opacity .2s, transform .12s;
    }
    .btn-join-confirm:hover  { opacity:.88; }
    .btn-join-confirm:active { transform:scale(.976); }
    .btn-join-confirm:disabled { opacity:.5; cursor:not-allowed; }

    .join-terms { font-size:11px; color:var(--t2); text-align:center; margin-top:10px; line-height:1.5; }
    .join-error {
      padding:10px 14px; background:rgba(255,76,76,.08);
      border:1px solid rgba(255,76,76,.25); border-radius:8px;
      font-size:13px; color:var(--red); margin-bottom:12px;
    }

    /* ── Room Revealed ── */
    .room-revealed {
      background:rgba(17,255,102,.05); border:1px solid rgba(17,255,102,.2);
      border-radius:12px; padding:16px;
    }
    .rr-header {
      display:flex; align-items:center; gap:8px;
      font-size:14px; font-weight:600; color:var(--green);
      margin-bottom:14px;
    }
    .rr-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 0; border-bottom:1px solid rgba(37,45,56,.5);
    }
    .rr-item:last-child { border-bottom:none; }
    .rr-label { color:var(--t1); font-size:13px; width:90px; flex-shrink:0; }
    .rr-value { font-size:16px; font-weight:700; color:var(--t0); font-family:'Orbitron',monospace; flex:1; }
    .rr-copy {
      background:var(--card2); border:1px solid var(--border); border-radius:6px;
      padding:5px 10px; font-size:12px; color:var(--cyan); cursor:pointer;
      transition:all .18s;
    }
    .rr-copy:hover { border-color:var(--cyan); }

    .mm-room-locked {
      display:flex; align-items:center; gap:10px;
      background:rgba(255,76,76,.05); border:1px solid rgba(255,76,76,.15);
      border-radius:10px; padding:12px 14px;
      font-size:13px; color:var(--t1);
    }
    .mm-room-locked svg { stroke:var(--t1); flex-shrink:0; }

    /* ── Success Screen ── */
    .join-success-screen {
      display:flex; flex-direction:column; align-items:center;
      text-align:center; padding:40px 20px; min-height:80vh;
      justify-content:center;
    }
    .js-icon  { font-size:64px; margin-bottom:16px; }
    .js-title { font-size:24px; font-weight:800; margin-bottom:8px; }
    .js-sub   { color:var(--t1); font-size:14px; margin-bottom:24px; }
    .js-details {
      width:100%; max-width:320px; background:var(--card);
      border:1px solid var(--border); border-radius:12px;
      padding:16px; margin-bottom:20px;
    }
    .js-row {
      display:flex; justify-content:space-between;
      font-size:13px; padding:8px 0;
      border-bottom:1px solid rgba(37,45,56,.5);
    }
    .js-row:last-child { border-bottom:none; }
    .js-row span { color:var(--t1); }
    .js-room-info { width:100%; max-width:380px; }

    /* ── Stream Link ── */
    .mc-stream-link {
      display:flex; align-items:center; gap:8px;
      margin-top:12px; padding:8px 12px;
      background:rgba(255,0,0,.06); border:1px solid rgba(255,0,0,.2);
      border-radius:8px; font-size:12px; color:#FF4C4C; text-decoration:none;
      transition:background .2s;
    }
    .mc-stream-link:hover { background:rgba(255,0,0,.12); }
    .stream-live-dot {
      width:7px; height:7px; border-radius:50%; background:#FF0000;
      animation:pulse-r 1.5s infinite;
    }
    @keyframes pulse-r { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }

    /* Responsive */
    @media (max-width:380px) {
      .slot-grid { grid-template-columns:repeat(4,1fr); gap:5px; }
      .slot-num  { font-size:11px; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Loading Spinner -->
  <div id="joinLoader">
    <div class="loader-spinner"></div>
    <p style="color:var(--t1);font-size:13px">Loading match details...</p>
  </div>

  <!-- ── MATCH HEADER (dynamic) ── -->
  <div id="joinMatchHeader"></div>

  <!-- ── MAIN CONTENT ── -->
  <div id="joinMain">

    <!-- Slot Grid Section -->
    <div class="join-section" id="slotGridContainer">
      <p style="color:var(--t1);text-align:center;padding:20px">Loading slots...</p>
    </div>

    <!-- Dynamic Player Fields Section -->
    <div class="join-section" id="playerFieldsContainer">
      <!-- Populated by join.js based on game.requiredPlayerFields -->
    </div>

    <!-- Entry Fee & Confirm Section -->
    <div class="join-section" id="entrySection">
      <!-- Populated by join.js -->
    </div>

  </div>

  <!-- ── INIT JOIN PAGE ── -->
  <script type="module">
    import { initJoinPage } from './js/join.js';
    document.addEventListener('DOMContentLoaded', initJoinPage);
  </script>

</body>
</html>
