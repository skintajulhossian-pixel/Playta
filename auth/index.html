<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>PLAYTA — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Thin neon edge accent lines -->
<div class="edge edge-left"  aria-hidden="true"></div>
<div class="edge edge-right" aria-hidden="true"></div>

<div class="page">
  <div class="container">

    <!-- LOGO: SVG controller icon only, no text -->
    <div class="logo-wrap">
      <svg class="logo-svg" viewBox="0 0 110 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="5" y1="5" x2="105" y2="115" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#7FFF30"/>
            <stop offset="28%"  stop-color="#30E880"/>
            <stop offset="65%"  stop-color="#00C878"/>
            <stop offset="100%" stop-color="#00A8B0"/>
          </linearGradient>
          <linearGradient id="ctrlGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#002018"/>
            <stop offset="100%" stop-color="#002030"/>
          </linearGradient>
          <filter id="logoGlow">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- Pentagon chat-bubble with tail -->
        <path d="M55 5 L100 30 L100 75 Q100 92 84 92 L68 92 L55 112 L42 92 L26 92 Q10 92 10 75 L10 30 Z"
              fill="url(#logoGrad)" filter="url(#logoGlow)"/>
        <!-- Controller body -->
        <rect x="21" y="48" width="68" height="30" rx="15" fill="url(#ctrlGrad)"/>
        <!-- D-pad horizontal -->
        <rect x="29" y="60" width="15" height="4" rx="2" fill="#fff" opacity=".92"/>
        <!-- D-pad vertical -->
        <rect x="34.5" y="54.5" width="4" height="15" rx="2" fill="#fff" opacity=".92"/>
        <!-- Action buttons -->
        <circle cx="75" cy="59" r="3.2" fill="#fff" opacity=".9"/>
        <circle cx="83" cy="59" r="3.2" fill="#fff" opacity=".9"/>
        <circle cx="79" cy="67" r="3.2" fill="#fff" opacity=".9"/>
        <!-- Center -->
        <circle cx="55" cy="63" r="3.8" fill="#fff" opacity=".22"/>
        <!-- Joystick hints -->
        <circle cx="36" cy="72" r="4.5" fill="#fff" opacity=".16"/>
        <circle cx="74" cy="72" r="4.5" fill="#fff" opacity=".16"/>
        <!-- Bumpers -->
        <rect x="28" y="42" width="16" height="5" rx="2.5" fill="#fff" opacity=".16"/>
        <rect x="66" y="42" width="16" height="5" rx="2.5" fill="#fff" opacity=".16"/>
      </svg>
    </div>

    <!-- Headings -->
    <p class="heading-sub">Welcome Back</p>
    <h1 class="heading-main">Gamer</h1>

    <!-- Login Form -->
    <form class="form" id="login-form" novalidate>

      <!-- Error alert box -->
      <div class="error-box" id="error-box" role="alert" aria-live="assertive">
        <svg class="error-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5" stroke="#FF4D4D" stroke-width="1.7"/>
          <line x1="12" y1="7" x2="12" y2="14" stroke="#FF4D4D" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="12" cy="17" r="1.3" fill="#FF4D4D"/>
        </svg>
        <span id="error-text">Invalid email, mobile or password. Please try again.</span>
      </div>

      <!-- Email / Mobile / Username -->
      <div class="field-group">
        <label class="field-label" for="login-id">Email, mobile or username</label>
        <div class="input-row input-green">
          <span class="input-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="8" r="3.8" stroke="#444" stroke-width="1.5"/>
              <path d="M4.5 20.5c0-4 3.4-7 7.5-7s7.5 3 7.5 7" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          <input
            type="text"
            id="login-id"
            name="identifier"
            class="field-input"
            placeholder="Enter your email, mobile or username"
            autocomplete="username"
            inputmode="email"
            required
            aria-required="true"
          >
        </div>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label" for="login-password">Password</label>
        <div class="input-row input-grey">
          <span class="input-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="11" width="14" height="10" rx="2.5" stroke="#444" stroke-width="1.5"/>
              <path d="M8 11V7.5a4 4 0 018 0V11" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="12" cy="16.5" r="1.5" fill="#444"/>
            </svg>
          </span>
          <input
            type="password"
            id="login-password"
            name="password"
            class="field-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            aria-required="true"
          >
          <button type="button" class="eye-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
            <svg id="eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none">
              <ellipse cx="12" cy="12" rx="9" ry="5.5" stroke="#444" stroke-width="1.5"/>
              <circle cx="12" cy="12" r="2.8" stroke="#444" stroke-width="1.5"/>
            </svg>
            <svg id="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" style="display:none">
              <path d="M3 3l18 18" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M10.5 10.7A3 3 0 0013.3 13.5M7 7C5 8.4 3 10.2 3 12c0 3 4 7 9 7 1.8 0 3.5-.5 5-1.4M9.3 5.2C10.2 5.1 11.1 5 12 5c5 0 9 4 9 7 0 1.2-.5 2.4-1.3 3.4" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember me + Forgot password -->
      <div class="check-row">
        <div class="check-left">
          <input type="checkbox" class="checkbox" id="remember-me" name="remember">
          <label class="check-label" for="remember-me">Remember me</label>
        </div>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Age verification -->
      <div class="confirm-row">
        <div class="check-left">
          <input type="checkbox" class="checkbox" id="age-confirm" name="ageConfirm" required>
          <label class="check-label" for="age-confirm">
            I confirm that I am 18 years or older
            <span class="check-sublabel">PLAYTA is only for users 18+ years old.</span>
          </label>
        </div>
        <button type="button" class="info-btn" aria-label="Age requirement info" title="You must be 18 or older to use PLAYTA.">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9.5" stroke="#444" stroke-width="1.4"/>
            <line x1="12" y1="11" x2="12" y2="17" stroke="#444" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="8" r="1.1" fill="#444"/>
          </svg>
        </button>
      </div>

      <!-- LOGIN BUTTON — Neon Green → Cyan (from Image 3 JOIN MATCH) -->
      <button type="submit" class="btn-login" id="login-btn" aria-label="Login to PLAYTA">
        <span class="btn-text">LOGIN</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

      <!-- OR Divider -->
      <div class="or-divider" aria-hidden="true"><span>OR</span></div>

      <!-- Google -->
      <button type="button" class="social-btn" onclick="socialLogin('google')" aria-label="Continue with Google">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <!-- Facebook -->
      <button type="button" class="social-btn" onclick="socialLogin('facebook')" aria-label="Continue with Facebook">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="12" fill="#1877F2"/>
          <path d="M16.5 8H14c-.6 0-1 .4-1 1v1.5h3.5l-.5 3H13V21h-3v-7.5H8v-3h2V9c0-2.2 1.8-4 4-4h2.5V8z" fill="#fff"/>
        </svg>
        Continue with Facebook
      </button>

    </form>

    <!-- Sign up link -->
    <p class="signup-text">
      Don't have an account?
      <a href="signup.html" class="signup-link">Sign up</a>
    </p>

    <!-- Legal footer -->
    <div class="legal-footer">
      <svg class="shield-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#CCFF00"/>
            <stop offset="100%" stop-color="#00F090"/>
          </linearGradient>
        </defs>
        <path d="M12 2L3 6.5v5.5C3 17.3 7 21.9 12 23c5-1.1 9-5.7 9-11V6.5L12 2z" fill="url(#shieldGrad)"/>
      </svg>
      <span>
        By continuing, you agree to our
        <a href="terms.html">Terms of Service</a> and
        <a href="privacy.html">Privacy Policy</a>.
      </span>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
