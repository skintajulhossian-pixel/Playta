<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<title>PLAYTA — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Thin neon edge accents — far outer edges only -->
<div class="accent accent-l" aria-hidden="true"></div>
<div class="accent accent-r" aria-hidden="true"></div>

<div class="page">

  <!-- ── LOGO: Pure SVG controller icon, no text ── -->
  <div class="logo">
    <svg viewBox="0 0 110 115" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#5FFF60"/>
          <stop offset="45%"  stop-color="#00F5A0"/>
          <stop offset="100%" stop-color="#00C8FF"/>
        </linearGradient>
        <linearGradient id="ctrl" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#004030"/>
          <stop offset="100%" stop-color="#003040"/>
        </linearGradient>
      </defs>
      <!-- Hexagonal chat-bubble shape -->
      <path d="
        M55 4
        L98 27
        L98 73
        Q98 90 82 90
        L65 90
        L55 106
        L45 90
        L28 90
        Q12 90 12 73
        L12 27
        Z
      " fill="url(#bg)"/>
      <!-- Controller body -->
      <rect x="24" y="42" width="62" height="30" rx="15" fill="url(#ctrl)" opacity="0.85"/>
      <!-- D-pad horizontal -->
      <rect x="31" y="54" width="14" height="4" rx="2" fill="#fff" opacity="0.9"/>
      <!-- D-pad vertical -->
      <rect x="36.5" y="48.5" width="4" height="15" rx="2" fill="#fff" opacity="0.9"/>
      <!-- Action buttons (right side) -->
      <circle cx="74" cy="53" r="3"   fill="#fff" opacity="0.9"/>
      <circle cx="82" cy="53" r="3"   fill="#fff" opacity="0.9"/>
      <circle cx="78" cy="60" r="3"   fill="#fff" opacity="0.9"/>
      <!-- Center dot -->
      <circle cx="55" cy="57" r="3.5" fill="#fff" opacity="0.35"/>
      <!-- Bumper hint left -->
      <rect x="26" y="36" width="18" height="5" rx="2.5" fill="#fff" opacity="0.25"/>
      <!-- Bumper hint right -->
      <rect x="66" y="36" width="18" height="5" rx="2.5" fill="#fff" opacity="0.25"/>
    </svg>
  </div>

  <!-- ── HEADINGS ── -->
  <div class="h-welcome">Welcome Back</div>
  <div class="h-gamer">Gamer</div>

  <!-- ── FORM ── -->
  <form class="form" id="login-form" novalidate>

    <!-- Error alert -->
    <div class="err-box hidden" id="login-alert" role="alert">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" flex-shrink="0" style="flex-shrink:0">
        <circle cx="12" cy="12" r="9.5" stroke="#FF5050" stroke-width="1.6"/>
        <line x1="12" y1="7.5" x2="12" y2="13.5" stroke="#FF5050" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="16.5" r="1.1" fill="#FF5050"/>
      </svg>
      <span id="login-alert-text">Invalid email, mobile or password. Please try again.</span>
    </div>

    <!-- Email / Mobile / Username -->
    <div class="field">
      <label class="field-lbl" for="login-id">Email, mobile or username</label>
      <div class="inp-row green-border">
        <span class="inp-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="3.8" stroke="#444" stroke-width="1.5"/>
            <path d="M4.5 20.5c0-4 3.4-7 7.5-7s7.5 3 7.5 7" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          type="text"
          id="login-id"
          name="identifier"
          placeholder="Enter your email, mobile or username"
          autocomplete="username"
          inputmode="email"
          required
          aria-required="true"
        >
      </div>
    </div>

    <!-- Password -->
    <div class="field">
      <label class="field-lbl" for="login-password">Password</label>
      <div class="inp-row grey-border">
        <span class="inp-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="11" width="14" height="10" rx="2.5" stroke="#444" stroke-width="1.5"/>
            <path d="M8 11V7.5a4 4 0 018 0V11" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="12" cy="16.5" r="1.5" fill="#444"/>
          </svg>
        </span>
        <input
          type="password"
          id="login-password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          aria-required="true"
        >
        <button type="button" class="eye-btn" id="eye-btn" onclick="togglePw()" aria-label="Toggle password">
          <!-- Eye open -->
          <svg id="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none">
            <ellipse cx="12" cy="12" rx="9" ry="5.5" stroke="#444" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="2.8" stroke="#444" stroke-width="1.5"/>
          </svg>
          <!-- Eye closed -->
          <svg id="eye-shut" width="20" height="20" viewBox="0 0 24 24" fill="none" style="display:none">
            <path d="M3 3l18 18" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M10.5 10.7A3 3 0 0013.3 13.5M7 7C4.8 8.5 3 10.2 3 12c0 3 4 7 9 7 1.8 0 3.5-.5 5-1.4M9.3 5.2A8.5 8.5 0 0112 5c5 0 9 4 9 7 0 1.2-.5 2.4-1.3 3.4" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Remember me + Forgot password -->
    <div class="check-row">
      <div class="check-l">
        <input type="checkbox" class="chk" id="remember-me" name="remember">
        <label class="check-lbl" for="remember-me">Remember me</label>
      </div>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <!-- 18+ confirmation -->
    <div class="confirm-row">
      <div class="confirm-l">
        <input type="checkbox" class="chk" id="age-confirm" name="age" required>
        <label class="check-lbl" for="age-confirm">
          I confirm that I am 18 years or older
          <span class="check-sub">PLAYTA is only for users 18+ years old.</span>
        </label>
      </div>
      <span class="info-ico" title="Age requirement">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9.5" stroke="#444" stroke-width="1.4"/>
          <line x1="12" y1="11" x2="12" y2="17" stroke="#444" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="8" r="1.1" fill="#444"/>
        </svg>
      </span>
    </div>

    <!-- LOGIN button -->
    <button class="btn-login" type="submit" id="login-btn">
      <span class="btn-txt">LOGIN</span>
      <div class="spin-wrap"><div class="spinner"></div></div>
    </button>

    <!-- OR Divider -->
    <div class="divider">OR</div>

    <!-- Google -->
    <button type="button" class="social-btn" onclick="socialLogin('google')">
      <svg class="sico" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Facebook -->
    <button type="button" class="social-btn" onclick="socialLogin('facebook')">
      <svg class="sico" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#1877F2"/>
        <path d="M16.5 8H14c-.6 0-1 .4-1 1v1.5h3.5l-.5 3H13V21h-3v-7.5H8v-3h2V9c0-2.2 1.8-4 4-4h2.5V8z" fill="#fff"/>
      </svg>
      Continue with Facebook
    </button>

  </form>

  <!-- Footer -->
  <div class="f-signup">
    Don't have an account? <a href="index.html?tab=signup">Sign up</a>
  </div>

  <div class="f-legal">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;margin-top:1px">
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#C8FF00"/>
          <stop offset="100%" stop-color="#00F5A0"/>
        </linearGradient>
      </defs>
      <path d="M12 2L3 6.5v5.5C3 17.3 7 21.9 12 23c5-1.1 9-5.7 9-11V6.5L12 2z" fill="url(#sg)"/>
    </svg>
    <span>
      By continuing, you agree to our
      <a href="#">Terms of Service</a> and
      <a href="#">Privacy Policy</a>.
    </span>
  </div>

</div><!-- /page -->

<script>
/* ── Password toggle ── */
function togglePw() {
  var inp  = document.getElementById('login-password');
  var open = document.getElementById('eye-open');
  var shut = document.getElementById('eye-shut');
  var show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  open.style.display = show ? 'none' : 'block';
  shut.style.display = show ? 'block' : 'none';
}

/* ── Social placeholder ── */
function socialLogin(p) {
  showErr('Social login coming soon. Please use email or mobile.');
}

/* ── Error display ── */
function showErr(msg) {
  var box  = document.getElementById('login-alert');
  var text = document.getElementById('login-alert-text');
  if (text) text.textContent = msg;
  if (box)  box.classList.remove('hidden');
}

/* ── 18+ guard (capture phase — before auth.js) ── */
document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('login-form');
  if (!form) return;
  form.addEventListener('submit', function(e) {
    var age = document.getElementById('age-confirm');
    if (age && !age.checked) {
      e.preventDefault();
      e.stopImmediatePropagation();
      showErr('You must confirm you are 18+ to continue.');
    }
  }, true);
});
</script>

<!-- Existing auth logic -->
<script src="auth.js" onerror="console.warn('auth.js not found')"></script>

</body>
</html>
